name: Step 0 # Start Exercise

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write # Update Readme
  actions: write # Disable/enable workflows
  issues: write # Create issue and comment on issues

env:
  STEP_1_FILE: ".github/steps/1-step.md"

jobs:
  start_exercise:
    if: |
      !github.event.repository.is_template
    name: Start Exercise
    runs-on: ubuntu-latest
    outputs:
      issue-url: ${{ steps.create-or-find-issue.outputs.issue-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.6.0

      - name: Disable all exercise workflows
        run: |
          workflows=$(git ls-files | grep -E '^\.github/workflows/[0-9].*\.(yml|yaml)$')
          for workflow in $workflows; do
            workflow_name="$(basename "$workflow")"
            echo "Disabling workflow: $workflow_name"
            gh workflow disable "$workflow_name" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build welcome message from template
        id: build-issue-description
        uses: skills/action-text-variables@v2
        with:
          template-file: exercise-toolkit/markdown-templates/step-feedback/welcome.md
          template-vars: |
            title: AI Coding Assistant Enablement Bootcamp Session 4
            login: ${{ github.actor }}
            intro_message: This exercise will help you learn how to expand GitHub Copilot's capabilities with Model Context Protocol (MCP) while building a Slalom consulting capabilities management system.

      - name: Create or find exercise issue
        id: create-or-find-issue
        uses: actions/github-script@v7
        env:
          ISSUE_BODY: ${{ steps.build-issue-description.outputs.updated-text }}
        with:
          script: |
            const exerciseTitle = "AI Coding Assistant Enablement Bootcamp Session 4";
            const issueTitlePrefix = "Exercise: ";
            const fullTitle = `${issueTitlePrefix}${exerciseTitle}`;

            // Check if an exercise issue already exists (to be idempotent on re-runs)
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const existingIssue = openIssues.find(i => i.title === fullTitle);
            if (existingIssue) {
              console.log(`Reusing existing issue: ${existingIssue.html_url}`);
              core.setOutput('issue-url', existingIssue.html_url);
              return;
            }

            // Create a new issue
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: fullTitle,
              body: process.env.ISSUE_BODY
            });
            console.log(`Created new issue: ${issue.html_url}`);
            core.setOutput('issue-url', issue.html_url);

      - name: Build README from template
        id: build-new-readme
        uses: skills/action-text-variables@v2
        with:
          template-file: exercise-toolkit/markdown-templates/readme/exercise-started.md
          template-vars: |
            title: AI Coding Assistant Enablement Bootcamp Session 4
            login: ${{ github.actor }}
            issue_url: ${{ steps.create-or-find-issue.outputs.issue-url }}

      - name: Overwrite README
        env:
          README_TEXT: ${{ steps.build-new-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md"
          message: "Start exercise"
          default_author: github_actions
          push: '--force'

  post_next_step_content:
    name: Post next step content
    runs-on: ubuntu-latest
    needs: [start_exercise]
    env:
      ISSUE_URL: ${{ needs.start_exercise.outputs.issue-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.6.0

      - name: Build comment - add step content
        id: build-comment
        uses: skills/action-text-variables@v1
        with:
          template-file: ${{ env.STEP_1_FILE }}
          template-vars: |
            full_repo_name=${{ github.repository }}

      - name: Create comment - add step content
        run: |
          gh issue comment "$ISSUE_URL" \
            --body "$ISSUE_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ steps.build-comment.outputs.updated-text }}

      - name: Create comment - watching for progress
        run: |
          gh issue comment "$ISSUE_URL" \
            --body-file exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "Step 0"
          gh workflow enable "Step 1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
